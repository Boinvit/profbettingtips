name: Results (hourly)

# Light run: results feeds only (football-data.org, API-Football, OpenLigaDB, ESPN, openfootball).
# No odds calls (The Odds API key is deliberately not passed), no football-data.co.uk download, no ClubElo.
# Shares a concurrency group with the full agent so the two never commit at the same time.
on:
  schedule:
    - cron: '10,40 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prediction-agent
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # branch tip at job start, not the stale commit from scheduling time
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Results-only agent run
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node agent/run.mjs --results-only

      - name: Commit data
        run: |
          git config user.name  "pbt-agent"
          git config user.email "pbt-agent@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && echo "no changes" && exit 0
          # Keep only the files this run changed, replay them on the newest branch tip. No merge, so no conflicts.
          git diff --cached --name-only --diff-filter=AM > /tmp/changed.txt
          tar -cf /tmp/ours.tar -T /tmp/changed.txt
          for i in 1 2 3 4; do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q --hard origin/${{ github.ref_name }}
            tar -xf /tmp/ours.tar
            git add -A data
            git diff --cached --quiet && echo "already up to date" && exit 0
            git commit -q -m "data: results update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push -q origin HEAD:${{ github.ref_name }} && exit 0
            sleep 5
          done
          exit 1
