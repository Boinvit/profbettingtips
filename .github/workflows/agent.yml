name: Prediction agent

on:
  schedule:
    - cron: '15 */3 * * *'      # every 3 hours (UTC)
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Backfill 3 seasons of history to train the model (use once, first run)'
        type: boolean
        default: false
      seasons:
        description: 'Deeper backfill: number of seasons of history to load (1-12). Overrides the checkbox above. Example: 8'
        type: string
        default: ''
  push:
    paths: ['data/jackpots/inbox.txt', 'data/config.json', 'data/aliases.json']

permissions:
  contents: write

concurrency:
  group: prediction-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # branch tip at job start, not the stale commit from scheduling time
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test agent/test/jackpot.test.mjs agent/test/sources.test.mjs agent/test/more-sources.test.mjs agent/test/results-merge.test.mjs

      - name: Install browser for SportPesa scrape
        continue-on-error: true      # a transient apt/DNS failure must not lose the whole run
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Scrape SportPesa (listed matches + jackpots)
        continue-on-error: true      # a blocked/changed page must never stop the rest of the agent
        run: node agent/scrape-sportpesa.mjs

      - name: Run agent (results, odds, ratings, news -> learn -> predict)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}   # optional
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}             # optional (API-Sports)
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}             # optional
        run: node agent/run.mjs ${{ inputs.seasons && format('--backfill={0}', inputs.seasons) || (inputs.backfill && '--backfill' || '') }}

      - name: Save scrape diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit data
        run: |
          git config user.name  "pbt-agent"
          git config user.email "pbt-agent@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && echo "no changes" && exit 0
          # Keep only the files this run changed, replay them on the newest branch tip. No merge, so no conflicts.
          git diff --cached --name-only --diff-filter=AM > /tmp/changed.txt
          tar -cf /tmp/ours.tar -T /tmp/changed.txt
          for i in 1 2 3 4; do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q --hard origin/${{ github.ref_name }}
            tar -xf /tmp/ours.tar
            git add -A data
            git diff --cached --quiet && echo "already up to date" && exit 0
            git commit -q -m "data: agent update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push -q origin HEAD:${{ github.ref_name }} && exit 0
            sleep 5
          done
          exit 1
